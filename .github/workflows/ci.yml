# Build and tests on every push and pull request: a broken change shows up here before Railway deploys it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kvita_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values; nothing here is a real secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kvita_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/kvita_test?schema=public
      JWT_ACCESS_SECRET: ci-test-secret-that-is-long-enough-1234567890
      CLIENT_ORIGIN: http://localhost:5180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (server + client)
        run: npm run typecheck
      - name: Tests (server with database, then client)
        run: npm test
      - name: Production build
        run: npm run build
